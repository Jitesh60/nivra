packages:
  - 'apps/*'
  - 'packages/*'
  - '!apps/mobile'

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - argon2
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - sharp
  - unrs-resolver
  - cpu-features
  - protobufjs
  - ssh2
