packages:
  - 'apps/*'
  - 'packages/*'
  - '!apps/mobile'

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - argon2
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - sharp
  - unrs-resolver
  - cpu-features
  - protobufjs
  - ssh2

# Security fixes in transitive dependencies (pnpm audit --prod), until upstream bumps them.
# Both arrive through the Prisma CLI: mysql2 is never loaded (we use Postgres), and
# deepmerge-ts only merges Prisma's own config.
overrides:
  mysql2: '>=3.22.0'
  deepmerge-ts: '>=8.0.0'
