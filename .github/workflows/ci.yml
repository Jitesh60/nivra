name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS · format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high or critical vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated Dart design tokens are committed
        run: git diff --exit-code -- apps/mobile/lib/core/theme/tokens.g.dart
      - name: OpenAPI document is up to date (run `pnpm --filter @sajha/api openapi:export`)
        run: |
          pnpm --filter @sajha/api openapi:export
          git diff --exit-code -- packages/api-client/openapi.json

  api-e2e:
    name: API · e2e + coverage (Postgres, Redis, Mailpit, SeaweedFS via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sajha/api prisma:generate
      - run: pnpm --filter @sajha/api test:cov

  admin-e2e:
    name: Browser e2e · admin + website (Playwright against the real API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sajha
          POSTGRES_PASSWORD: sajha
          POSTGRES_DB: sajha
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sajha -d sajha" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      # Email OTPs (the listings suite verifies a lender's email through the API).
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025']
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
    env:
      DATABASE_URL: postgresql://sajha:sajha@localhost:5432/sajha?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-user-access-secret-0123456789abcdef
      JWT_ADMIN_ACCESS_SECRET: ci-admin-access-secret-0123456789abcdef
      OTP_PEPPER: ci-otp-pepper-0123456789abcdef0123456789
      TOTP_ENC_KEY: Y2ktdG90cC1rZXktMzItYnl0ZXMtbG9uZyEhISEhISE=
      ADDRESS_ENC_KEY: Y2ktYWRkcmVzcy1rZXktMzItYnl0ZXMtbG9uZyEhISE=
      SAJHA_API_URL: http://localhost:3000
      # The website's waitlist form calls the API from the browser.
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      # Real storage (SeaweedFS, started below): the admin suite uploads and reviews documents.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: sajha
      S3_SECRET_ACCESS_KEY: sajha-s3-secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_BUCKET: sajha-public-media
      S3_PRIVATE_BUCKET: sajha-private-docs
      S3_PUBLIC_BASE_URL: http://localhost:9000/sajha-public-media
      # The admin suite signs up app users through the API (never allowed in production).
      OTP_DEV_BYPASS_CODE: '000000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3 storage (SeaweedFS) and create buckets
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -v "$PWD/infra/s3/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs server -dir=/data -s3 -s3.port=8333 \
            -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
          export AWS_ACCESS_KEY_ID=sajha AWS_SECRET_ACCESS_KEY=sajha-s3-secret AWS_DEFAULT_REGION=ap-south-1
          for b in sajha-public-media sajha-private-docs; do
            for i in $(seq 1 30); do
              aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket $b && break
              sleep 2
            done
          done
          aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket sajha-private-docs
      - run: pnpm turbo run build --filter=@sajha/api --filter=@sajha/admin --filter=@sajha/web
      - run: pnpm --filter @sajha/api prisma:deploy
      - name: Start API
        run: |
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/v1/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm --filter @sajha/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @sajha/admin test:e2e
        env:
          CI: 'true'
      - run: pnpm --filter @sajha/web test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
            apps/web/playwright-report
            apps/web/test-results
            api.log

  mobile:
    name: Mobile · format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  mobile-android:
    name: Mobile · Android release build (signing config, R8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # Staging, debug-signed: proves the release build (R8, plugins) compiles.
      # Prod store bundles need the upload key (docs/RELEASE.md).
      - run: flutter build apk --release --flavor staging --dart-define-from-file=config/staging.json
      - name: A prod release without the upload key is refused
        run: |
          if flutter build appbundle --release --flavor prod --dart-define-from-file=config/prod.json 2> build.log; then
            echo "Expected the prod bundle to be refused without android/key.properties" && exit 1
          fi
          grep -q "Prod release builds need android/key.properties" build.log
