name: Backup

# Nightly logical backup of the production database to S3 (ap-south-1), on top of
# Railway's own volume backups. Skips with a notice until the secrets exist.
# Restore with scripts/restore-drill.sh s3://… (docs/OPERATIONS.md).

on:
  schedule:
    - cron: '17 20 * * *' # 01:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  pg-dump:
    name: pg_dump to S3
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION || 'ap-south-1' }}
      BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - id: ready
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$BUCKET" ]; then
            echo "::notice title=Backup skipped::Set BACKUP_DATABASE_URL, BACKUP_AWS_ACCESS_KEY_ID, BACKUP_AWS_SECRET_ACCESS_KEY and BACKUP_BUCKET on the production environment (docs/OPERATIONS.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump (custom format, same major version as the server)
        if: steps.ready.outputs.go == 'true'
        run: |
          file="sajha-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker run --rm postgis/postgis:16-3.4 \
            pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > "$file"
          # A dump that can't be listed is not a backup.
          docker run --rm -i postgis/postgis:16-3.4 pg_restore --list < "$file" > /dev/null
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "Dump size: $(du -h "$file" | cut -f1)"
      - name: Upload (server-side encrypted)
        if: steps.ready.outputs.go == 'true'
        run: |
          aws s3 cp --only-show-errors --sse aws:kms --storage-class STANDARD_IA \
            "$FILE" "s3://$BUCKET/postgres/production/$FILE"
          echo "Uploaded s3://$BUCKET/postgres/production/$FILE" >> "$GITHUB_STEP_SUMMARY"
