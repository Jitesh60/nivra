name: Build APK

# A test APK to install on a phone. Run it from the Actions tab (Build APK,
# then Run workflow) and download the file from the run's Summary page.
# It is debug-signed: fine for side-loading, not for the Play Store (see
# docs/RELEASE.md for store builds).

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which build to make (installs side by side)
        type: choice
        options: [staging, dev]
        default: staging
      api_base_url:
        description: "API address the app talks to (blank = the flavor's config, e.g. https://api.staging.sajha.app)"
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    name: Android APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Build config
        env:
          FLAVOR: ${{ inputs.flavor }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            cp "config/$FLAVOR.json" build-config.json
          else
            case "$API_BASE_URL" in
              http://*|https://*) ;;
              *) echo "api_base_url must start with http:// or https://" && exit 1 ;;
            esac
            jq --arg url "${API_BASE_URL%/}" '.API_BASE_URL = $url' "config/$FLAVOR.json" > build-config.json
          fi
          echo "Building $FLAVOR against $(jq -r .API_BASE_URL build-config.json)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: flutter build apk --release --flavor "$FLAVOR" --dart-define-from-file=build-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: nivra-${{ inputs.flavor }}-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-release.apk
          if-no-files-found: error
          retention-days: 30
